<!DOCTYPE html>
<html lang="en">
<head>
    
<script src="config.js"></script>
     
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AI Chatbot</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #212121;
            color: white;
            height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 250px;
            background: #171717;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .sidebar h2 {
            margin-bottom: 20px;
        }

        .new-chat-btn {
            background: #292929;
            color: white;
            border: 1px solid #444;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
        }

        .new-chat-btn:hover {
            background: #383838;
        }

        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            padding: 25px;
        }

        .chat-body {
            width: 100%;
            max-width: 800px;
            flex: 1;
            overflow-y: auto;
            padding: 20px 0 120px;
        }

        .welcome {
            text-align: center;
            margin-top: 120px;
        }

        .welcome h1 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        .welcome p {
            color: #aaa;
        }

        .message {
            padding: 14px 18px;
            margin: 15px 0;
            border-radius: 15px;
            max-width: 85%;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .user-message {
            background: #303030;
            margin-left: auto;
        }

        .ai-message {
            background: transparent;
            margin-right: auto;
        }

        .chat-input-container {
            position: absolute;
            bottom: 25px;
            width: calc(100% - 50px);
            max-width: 800px;
            display: flex;
            background: #303030;
            border: 1px solid #555;
            border-radius: 25px;
            padding: 10px 15px;
        }

        .chat-input-container input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            font-size: 16px;
            padding: 10px;
        }

        .chat-input-container button {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: white;
            color: black;
            font-size: 24px;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            .sidebar {
                width: 75px;
                padding: 10px;
            }

            .sidebar h2 {
                font-size: 13px;
            }

            .new-chat-btn {
                font-size: 11px;
                padding: 8px;
            }

            .main-chat {
                padding: 15px;
            }

            .chat-input-container {
                width: calc(100% - 30px);
                bottom: 15px;
            }

        }
       .typing {
    opacity: 0.6;
    font-style: italic;
    animation: blink 1s infinite;
}

@keyframes blink {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.9; }
}
    </style>
   
</head>

<body>

    <div class="sidebar">
        <h2>💬 My AI</h2>
        <button class="new-chat-btn" id="newChatBtn">+ New Chat</button>
    </div>

    <div class="main-chat">

        <div class="chat-body" id="chatBody">
            <div class="welcome" id="welcome">
                <h1>How can I help you?</h1>
                <p>Ask me anything...</p>
            </div>
        </div>

        <div class="chat-input-container">
            <input
                type="text"
                id="userInput"
                placeholder="Message My AI..."
                autocomplete="off"
            >

            <button id="sendBtn">↑</button>
        </div>

    </div>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        const input = document.getElementById("userInput");
        const sendBtn = document.getElementById("sendBtn");
        const chatBody = document.getElementById("chatBody");
        const newChatBtn = document.getElementById("newChatBtn");
        const welcome = document.getElementById("welcome");

        function addMessage(message, className) {
            const messageDiv = document.createElement("div");

            messageDiv.className = "message " + className;
           if (className === "ai-message") {
    messageDiv.innerHTML = marked.parse(message);
} else {
    messageDiv.textContent = message;
}
            chatBody.appendChild(messageDiv);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

let chatHistory = [];

async function getAIReply(message) {
    const models = [
        "gemini-2.5-flash",
        "gemini-flash-lite-latest",
        "gemini-flash-latest"
    ];

    chatHistory.push({ role: "user", parts: [{ text: message }] });

    for (const model of models) {
        for (let attempt = 1; attempt <= 3; attempt++) {
            try {
                const response = await fetch(
                    "https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent",
                    {
                        signal: AbortSignal.timeout(30000),
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "x-goog-api-key":CONFIG.GEMINI_API_KEY
                        },
                        body: JSON.stringify({
                            contents: chatHistory,
                            systemInstruction: {
                                parts: [{ text: "You are LanXex, a helpful assistant. Answer clearly and keep it reasonably short. STRICT RULES: Never use LaTex, never use backslash commands like \\mathbf or \\text, and never use dollar signs. Write math only in plain text, for example: F=m*a, units like m/s^2.For bold, use **word** no specs inside the asterrisks." }]
                            },
                            generationConfig: { maxOutputTokens: 4096 }
                        })
                    }
                );

                const data = await response.json();

                if (data.error) {
                    console.error(model, data.error.code, data.error.message);
                    if ([503, 429, 404].includes(data.error.code)) {
                        await new Promise(r => setTimeout(r, attempt * 3000));
                        continue;
                    }
                    chatHistory.pop();
                    return "API Error: " + data.error.message;
                }

                const reply = data.candidates[0].content.parts
                    .filter(p => p.text && !p.thought)
                    .map(p => p.text)
                    .join("");

                chatHistory.push({ role: "model", parts: [{ text: reply }] });
                return reply;
            } catch (error) {
                console.error(model, error);
                if (error.name === "TimeoutError" || error.name === "AbortError") {
                    continue;
                }
                chatHistory.pop();
                return "Error: " + error.message;
            }
        }
    }

    chatHistory.pop();
    return "Server abhi busy hai, 1 minute baad dobara try karo.";
}

        async function sendMessage() {

            const message = input.value.trim();

            if (message === "") {
                return;
            }

            if (welcome) {
                welcome.style.display = "none";
            }

            addMessage(message, "user-message");

            input.value = "";
            const typingDiv = document.createElement("div");
    typingDiv.className = "message ai-message typing";
    typingDiv.textContent = "Typing...";
    chatBody.appendChild(typingDiv);
    chatBody.scrollTop = chatBody.scrollHeight;

          const reply =await getAIReply(message);
          typingDiv.remove();
          addMessage(reply,"ai-message");
        } 

        sendBtn.addEventListener("click", sendMessage);

        input.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });

        newChatBtn.addEventListener("click", function () {
            chatBody.innerHTML = `
                <div class="welcome" id="welcome">
                    <h1>How can I help you?</h1>
                    <p>Ask me anything...</p>
                </div>
            `;
        });
        
    </script>

</body>
</html>
